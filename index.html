<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>🌊 SCADA - Calidad del Agua</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/raphael/2.3.0/raphael.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/justgage/1.6.1/justgage.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --bg-color: #0b0f1a;
            --card-bg: #12182b;
            --panel-bg: #1a2238;
            --ok-color: #00ff88;
            --warn-color: #ffd000;
            --bad-color: #ff4d4d;
            --text-muted: #8892b0;
            --border-color: #1e2942;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-color);
            color: #fff;
            padding: 15px;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* ===== HEADER ===== */
        header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            max-width: 1400px;
            margin: 0 auto 20px auto;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 15px;
            gap: 10px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-left h2 {
            font-size: 1.3em;
            letter-spacing: 0.5px;
            background: linear-gradient(135deg, #00e5ff, #00ff88);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-left .version {
            font-size: 0.6em;
            color: var(--text-muted);
            background: var(--card-bg);
            padding: 2px 10px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn-action {
            background: var(--card-bg);
            color: #fff;
            border: 1px solid var(--border-color);
            padding: 6px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.8em;
            transition: all 0.3s ease;
        }

        .btn-action:hover {
            background: var(--panel-bg);
            border-color: var(--ok-color);
            transform: scale(1.02);
        }

        .btn-action.muted {
            border-color: var(--bad-color);
            color: var(--bad-color);
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8em;
            background: var(--card-bg);
            padding: 5px 14px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: var(--bad-color);
            box-shadow: 0 0 8px var(--bad-color);
            transition: all 0.5s ease;
        }

        .dot.online {
            background-color: var(--ok-color);
            box-shadow: 0 0 12px var(--ok-color);
            animation: pulse-green 2s infinite;
        }

        .dot.warning {
            background-color: var(--warn-color);
            box-shadow: 0 0 12px var(--warn-color);
            animation: pulse-yellow 1.5s infinite;
        }

        .dot.bad {
            background-color: var(--bad-color);
            box-shadow: 0 0 12px var(--bad-color);
            animation: pulse-red 1s infinite;
        }

        .dot.offline {
            background-color: #555;
            box-shadow: none;
            animation: none;
        }

        @keyframes pulse-green {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(0.8); }
        }

        @keyframes pulse-yellow {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.85); }
        }

        @keyframes pulse-red {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.9); }
        }

        .status-text {
            font-weight: 500;
        }

        .status-text.online { color: var(--ok-color); }
        .status-text.warning { color: var(--warn-color); }
        .status-text.bad { color: var(--bad-color); }
        .status-text.offline { color: var(--text-muted); }

        /* ===== MAIN LAYOUT ===== */
        .main-layout {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        @media (min-width: 992px) {
            .main-layout { grid-template-columns: 3fr 1fr; }
        }

        .left-column {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            min-width: 0;
        }

        /* ===== GAUGES ===== */
        .gauges-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            width: 100%;
        }

        @media (min-width: 600px) {
            .gauges-grid { grid-template-columns: repeat(3, 1fr); }
        }

        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 18px 15px 15px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: border-color 0.5s ease;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            transition: background 0.5s ease;
        }

        .card.status-ok::before { background: var(--ok-color); }
        .card.status-warn::before { background: var(--warn-color); }
        .card.status-bad::before { background: var(--bad-color); }
        .card.status-offline::before { background: var(--text-muted); }

        .gauge-title {
            font-size: 1em;
            font-weight: 600;
            color: #00e5ff;
            margin-bottom: 3px;
            letter-spacing: 0.8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .gauge-title .unit-badge {
            font-size: 0.6em;
            color: var(--text-muted);
            background: var(--panel-bg);
            padding: 1px 8px;
            border-radius: 8px;
        }

        .gauge-wrapper {
            width: 100%;
            max-width: 260px;
            height: 150px;
            position: relative;
        }

        .status-badge {
            margin-top: 5px;
            padding: 5px 16px;
            border-radius: 12px;
            font-size: 0.8em;
            font-weight: 600;
            text-align: center;
            width: 100%;
            max-width: 260px;
            transition: all 0.4s ease;
            min-height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .status-badge .icon {
            font-size: 1em;
        }

        .status-badge.ok {
            background: rgba(0, 255, 136, 0.12);
            color: var(--ok-color);
            border: 1px solid rgba(0, 255, 136, 0.3);
        }

        .status-badge.warn {
            background: rgba(255, 208, 0, 0.12);
            color: var(--warn-color);
            border: 1px solid rgba(255, 208, 0, 0.3);
        }

        .status-badge.bad {
            background: rgba(255, 77, 77, 0.12);
            color: var(--bad-color);
            border: 1px solid rgba(255, 77, 77, 0.3);
        }

        .status-badge.offline {
            background: rgba(136, 146, 176, 0.1);
            color: var(--text-muted);
            border: 1px solid rgba(136, 146, 176, 0.2);
        }

        /* ===== CHART ===== */
        .chart-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 15px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
            width: 100%;
            height: 260px;
            min-width: 0;
            position: relative;
        }

        .chart-card .chart-title {
            position: absolute;
            top: 8px;
            left: 15px;
            font-size: 0.7em;
            color: var(--text-muted);
            font-weight: 500;
            letter-spacing: 0.5px;
            z-index: 10;
        }

        .chart-card .chart-status {
            position: absolute;
            top: 8px;
            right: 15px;
            font-size: 0.6em;
            color: var(--text-muted);
            background: var(--panel-bg);
            padding: 2px 10px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            z-index: 10;
        }

        .chart-card canvas {
            width: 100% !important;
            height: 100% !important;
        }

        /* ===== ALERTS PANEL ===== */
.alerts-panel {
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 16px;
    padding: 15px;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    max-height: 350px;
    min-height: 200px;
    overflow: hidden;
}

@media (min-width: 992px) {
    .alerts-panel { max-height: 100%; min-height: 400px; }
}

.alerts-header {
    font-size: 0.9em;
    font-weight: 600;
    margin-bottom: 10px;
    color: var(--text-muted);
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--border-color);
    padding-bottom: 8px;
    flex-shrink: 0;
}

.alerts-header-left {
    display: flex;
    align-items: center;
    gap: 10px;
}

.alerts-header .badge-count {
    background: var(--bad-color);
    color: #fff;
    font-size: 0.7em;
    padding: 1px 10px;
    border-radius: 12px;
    font-weight: 700;
    min-width: 20px;
    text-align: center;
}

.alerts-header .badge-count.warn {
    background: var(--warn-color);
    color: #000;
}

.alerts-header .badge-count.ok {
    background: var(--ok-color);
    color: #000;
}

.alerts-list {
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 6px;
    flex: 1;
    padding-right: 4px;
    max-height: 280px;
    min-height: 80px;
}

.alerts-list::-webkit-scrollbar {
    width: 4px;
}

.alerts-list::-webkit-scrollbar-track {
    background: var(--bg-color);
    border-radius: 4px;
}

.alerts-list::-webkit-scrollbar-thumb {
    background: var(--border-color);
    border-radius: 4px;
}

.alert-item {
    background: var(--panel-bg);
    border-left: 3px solid var(--bad-color);
    padding: 6px 10px;
    border-radius: 6px;
    font-size: 0.78em;
    animation: slideIn 0.3s ease;
    flex-shrink: 0;
}

.alert-item.warn-alert {
    border-left-color: var(--warn-color);
}

.alert-item.ok-alert {
    border-left-color: var(--ok-color);
    opacity: 0.7;
}

.alert-item .timestamp {
    font-size: 0.7em;
    color: var(--text-muted);
    margin-top: 2px;
}

.alert-item .alert-message {
    display: flex;
    align-items: center;
    gap: 6px;
    word-break: break-word;
}

.alert-empty {
    color: var(--text-muted);
    font-size: 0.8em;
    text-align: center;
    padding: 20px 0;
}

@keyframes slideIn {
    from { opacity: 0; transform: translateX(-20px); }
    to { opacity: 1; transform: translateX(0); }
}

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* ===== LOADING OVERLAY ===== */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(11, 15, 26, 0.9);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            flex-direction: column;
            gap: 20px;
        }

        .loading-overlay.active {
            display: flex;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid var(--border-color);
            border-top-color: var(--ok-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            color: var(--text-muted);
            font-size: 0.9em;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            body { padding: 8px; }
            .header-left h2 { font-size: 1em; }
            .gauge-wrapper { max-width: 200px; height: 120px; }
            .chart-card { height: 200px; }
            .alerts-panel { max-height: 250px; }
            .status-badge { font-size: 0.7em; }
        }
    </style>
</head>
<body>

    <!-- ===== LOADING OVERLAY ===== -->
    <div id="loadingOverlay" class="loading-overlay">
        <div class="loading-spinner"></div>
        <div class="loading-text">Conectando al servidor...</div>
    </div>

    <!-- ===== HEADER ===== -->
    <header>
        <div class="header-left">
            <h2>🌊 SCADA - Calidad del Agua</h2>
            <span class="version">v2.1</span>
        </div>
        <div class="header-controls">
            <button id="btnMute" class="btn-action" onclick="toggleMute()">🔊 Sonido</button>
            <button id="btnReconnect" class="btn-action" onclick="manualReconnect()" style="display:none;">🔄 Reconectar</button>
            <button id="btnClearChart" class="btn-action" onclick="clearChart()" title="Limpiar gráfico">🗑️ Limpiar</button>
            <div class="status-indicator">
                <div id="statusDot" class="dot offline"></div>
                <span id="statusText" class="status-text offline">Inicializando...</span>
            </div>
        </div>
    </header>

    <!-- ===== MAIN CONTENT ===== -->
    <div class="main-layout">
        <div class="left-column">
            <div class="gauges-grid">
                <!-- Temperatura -->
                <div id="cardTemp" class="card status-offline">
                    <div class="gauge-title">
                        🌡️ Temperatura
                        <span class="unit-badge">°C</span>
                    </div>
                    <div class="gauge-wrapper"><div id="gaugeTemp"></div></div>
                    <div id="statusTemp" class="status-badge offline">
                        <span class="icon">⏳</span> Esperando datos...
                    </div>
                </div>

                <!-- pH -->
                <div id="cardPh" class="card status-offline">
                    <div class="gauge-title" style="color: #ffd000;">
                        🧪 pH
                        <span class="unit-badge">pH</span>
                    </div>
                    <div class="gauge-wrapper"><div id="gaugePh"></div></div>
                    <div id="statusPh" class="status-badge offline">
                        <span class="icon">⏳</span> Esperando datos...
                    </div>
                </div>

                <!-- Oxígeno -->
                <div id="cardOxy" class="card status-offline">
                    <div class="gauge-title" style="color: #00ff88;">
                        💨 Oxígeno Disuelto
                        <span class="unit-badge">mg/L</span>
                    </div>
                    <div class="gauge-wrapper"><div id="gaugeOxy"></div></div>
                    <div id="statusOxy" class="status-badge offline">
                        <span class="icon">⏳</span> Esperando datos...
                    </div>
                </div>
            </div>

            <!-- Chart -->
            <div class="chart-card">
                <span class="chart-title">📈 Historial de parámetros</span>
                <span id="chartStatus" class="chart-status">⏳ Esperando datos...</span>
                <canvas id="telemetryChart"></canvas>
            </div>
        </div>

        <!-- Alerts Panel -->
        <div class="alerts-panel">
    <div class="alerts-header">
        <div class="alerts-header-left">
            <span>🚨 Registro de eventos</span>
            <span id="alertBadge" class="badge-count ok">0</span>
        </div>
        <button id="btnClearAlerts" class="btn-action" onclick="clearAlerts()" style="font-size:0.7em; padding:2px 10px;">
            🗑️ Limpiar
        </button>
    </div>
    <div id="alertsList" class="alerts-list">
        <div class="alert-empty">✅ Sin eventos registrados</div>
    </div>
</div>

    <script>
        // ============================================================
        //  CONFIGURACIÓN
        // ============================================================
        const TB_HOST = "thingsboard.cloud";
        const DEVICE_ID = "0d580f10-a62d-11f1-9b46-e7fbeb690c95";
        const TB_USER = "scada-viewer@tuempresa.com";
        const TB_PASSWORD = "9b46-e7fbeb690c95";

        // ===== UMBRALES OPTIMIZADOS =====
        const THRESHOLDS = {
            temperature: {
                minWarn: 5,
                minOk: 10,
                maxOk: 35,
                maxWarn: 40,
                unit: '°C',
                label: 'Temperatura'
            },
            ph: {
                minWarn: 5.0,
                minOk: 6.0,
                maxOk: 8.5,
                maxWarn: 9.5,
                unit: '',
                label: 'pH'
            },
            oxygen: {
                minWarn: 2.0,
                minOk: 4.0,
                maxOk: 10.0,
                maxWarn: 12.0,
                unit: 'mg/L',
                label: 'Oxígeno'
            }
        };

        // ===== VARIABLES GLOBALES =====
        let gaugeTemp, gaugePh, gaugeOxy, telemetryChart;
        let jwtToken = null;
        let webSocket = null;
        let alertCounter = 0;
        let isMuted = false;
        let reconnectAttempts = 0;
        const MAX_RECONNECT_ATTEMPTS = 10;
        const maxChartPoints = 30;

        let dataWatchdogTimer = null;
        const DATA_TIMEOUT_MS = 25000;

        // Estado de salud del sistema
        const systemHealth = {
            wsConnected: false,
            tempValid: false,
            phValid: false,
            oxyValid: false,
            lastDataTime: 0
        };

        const previousStates = { Temp: null, Ph: null, Oxy: null };

        let audioCtx = null;

        // ============================================================
        //  FUNCIONES DE AUDIO
        // ============================================================
        function playAlarmSound() {
            if (isMuted) return;
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') audioCtx.resume();

                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(880, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.4);
            } catch (e) {
                console.warn('Audio no disponible:', e);
            }
        }

        function playOkSound() {
            if (isMuted) return;
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') audioCtx.resume();

                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(660, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.2);
            } catch (e) {
                // Silencioso
            }
        }

        function toggleMute() {
            isMuted = !isMuted;
            const btn = document.getElementById("btnMute");
            btn.innerText = isMuted ? "🔇 Silenciado" : "🔊 Sonido";
            btn.classList.toggle('muted', isMuted);
        }

        // ============================================================
        //  INICIALIZACIÓN
        // ============================================================
        window.onload = async () => {
            showLoading(true, "Inicializando dashboard...");
            initGauges();
            initChart();
            await loginAndConnect();
        };

        function initGauges() {
            gaugeTemp = new JustGage({
                id: "gaugeTemp",
                value: 0,
                min: -10,
                max: 50,
                label: "°C",
                gaugeColor: "#1e2942",
                levelColors: ["#ff4d4d", "#ffd000", "#00ff88", "#ffd000", "#ff4d4d"],
                valueFontColor: "#fff",
                labelFontColor: "#8892b0",
                shadowOpacity: 0.3,
                valueFontSize: 40
            });

            gaugePh = new JustGage({
                id: "gaugePh",
                value: 0,
                min: 0,
                max: 14,
                label: "pH",
                gaugeColor: "#1e2942",
                levelColors: ["#ff4d4d", "#ffd000", "#00ff88", "#ffd000", "#ff4d4d"],
                valueFontColor: "#fff",
                labelFontColor: "#8892b0",
                shadowOpacity: 0.3,
                valueFontSize: 40
            });

            gaugeOxy = new JustGage({
                id: "gaugeOxy",
                value: 0,
                min: 0,
                max: 15,
                label: "mg/L",
                gaugeColor: "#1e2942",
                levelColors: ["#ff4d4d", "#ffd000", "#00ff88", "#ffd000", "#ff4d4d"],
                valueFontColor: "#fff",
                labelFontColor: "#8892b0",
                shadowOpacity: 0.3,
                valueFontSize: 40
            });
        }

        function initChart() {
            const ctx = document.getElementById('telemetryChart').getContext('2d');
            telemetryChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [
                        {
                            label: 'Temperatura (°C)',
                            borderColor: '#00e5ff',
                            backgroundColor: 'rgba(0, 229, 255, 0.05)',
                            data: [],
                            tension: 0.3,
                            pointRadius: 3,
                            pointBackgroundColor: '#00e5ff',
                            spanGaps: false,
                            fill: false
                        },
                        {
                            label: 'pH',
                            borderColor: '#ffd000',
                            backgroundColor: 'rgba(255, 208, 0, 0.05)',
                            data: [],
                            tension: 0.3,
                            pointRadius: 3,
                            pointBackgroundColor: '#ffd000',
                            spanGaps: false,
                            fill: false
                        },
                        {
                            label: 'Oxígeno (mg/L)',
                            borderColor: '#00ff88',
                            backgroundColor: 'rgba(0, 255, 136, 0.05)',
                            data: [],
                            tension: 0.3,
                            pointRadius: 3,
                            pointBackgroundColor: '#00ff88',
                            spanGaps: false,
                            fill: false
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: {
                        mode: 'index',
                        intersect: false
                    },
                    scales: {
                        x: {
                            ticks: { color: '#8892b0', font: { size: 9 } },
                            grid: { color: 'rgba(30, 41, 66, 0.3)' }
                        },
                        y: {
                            ticks: { color: '#8892b0', font: { size: 9 } },
                            grid: { color: 'rgba(30, 41, 66, 0.3)' }
                        }
                    },
                    plugins: {
                        legend: {
                            labels: {
                                color: '#8892b0',
                                font: { size: 10 },
                                boxWidth: 12,
                                padding: 8
                            }
                        }
                    }
                }
            });
        }

        // ============================================================
        //  AUTENTICACIÓN Y WEBSOCKET
        // ============================================================
        async function loginAndConnect() {
            showLoading(true, "Autenticando en ThingsBoard...");
            try {
                const loginRes = await fetch(`https://${TB_HOST}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: TB_USER, password: TB_PASSWORD })
                });

                if (!loginRes.ok) {
                    throw new Error(`HTTP ${loginRes.status}: ${loginRes.statusText}`);
                }

                const loginData = await loginRes.json();
                jwtToken = loginData.token;

                updateStatus('warning', "Conectando WebSocket...");
                connectWebSocket(jwtToken);

            } catch (err) {
                console.error("Error de autenticación:", err);
                systemHealth.wsConnected = false;
                clearAllGaugesToOffline();
                updateStatus('bad', `Error: ${err.message}`);
                showLoading(false);
                document.getElementById('btnReconnect').style.display = 'inline-block';

                setTimeout(() => {
                    if (!systemHealth.wsConnected) {
                        loginAndConnect();
                    }
                }, 10000);
            }
        }

        function connectWebSocket(token) {
            const wsUrl = `wss://${TB_HOST}/api/ws/plugins/telemetry?token=${token}`;
            webSocket = new WebSocket(wsUrl);

            webSocket.onopen = () => {
                systemHealth.wsConnected = true;
                reconnectAttempts = 0;
                document.getElementById('btnReconnect').style.display = 'none';
                showLoading(false);
                updateStatus('warning', "Esperando telemetría...");

                // 🔥 LIMPIAR GRÁFICO AL RECONECTAR
                clearChart();
                document.getElementById('chartStatus').textContent = '🔄 Reconectado - esperando datos...';

                const subCmd = {
                    tsSubCmds: [
                        {
                            entityType: "DEVICE",
                            entityId: DEVICE_ID,
                            scope: "LATEST_TELEMETRY",
                            cmdId: 1
                        }
                    ]
                };
                webSocket.send(JSON.stringify(subCmd));
            };

            webSocket.onmessage = (event) => {
                try {
                    const msg = JSON.parse(event.data);
                    if (msg.data) {
                        resetDataWatchdog();
                        processTelemetry(msg.data);
                    }
                } catch (e) {
                    console.warn("Error procesando mensaje:", e);
                }
            };

            webSocket.onclose = (event) => {
                systemHealth.wsConnected = false;
                clearTimeout(dataWatchdogTimer);
                clearAllGaugesToOffline();
                updateStatus('bad', "Servidor desconectado");
                showLoading(false);

                if (reconnectAttempts < MAX_RECONNECT_ATTEMPTS) {
                    reconnectAttempts++;
                    const delay = Math.min(5000 * reconnectAttempts, 30000);
                    updateStatus('warning', `Reconectando en ${delay/1000}s... (${reconnectAttempts}/${MAX_RECONNECT_ATTEMPTS})`);
                    setTimeout(loginAndConnect, delay);
                } else {
                    updateStatus('bad', "Error crítico - reinicie manualmente");
                    document.getElementById('btnReconnect').style.display = 'inline-block';
                }
            };

            webSocket.onerror = (err) => {
                console.error("WebSocket error:", err);
            };
        }

        function manualReconnect() {
            reconnectAttempts = 0;
            document.getElementById('btnReconnect').style.display = 'none';
            showLoading(true, "Reconectando manualmente...");
            if (webSocket) {
                try { webSocket.close(); } catch(e) {}
            }
            loginAndConnect();
        }

        // ============================================================
        //  PROCESAMIENTO DE TELEMETRÍA
        // ============================================================
        function processTelemetry(data) {
            const timeStr = new Date().toLocaleTimeString([], {
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });

            systemHealth.lastDataTime = Date.now();

            let tempVal = null, phVal = null, oxyVal = null;
            let hasValidData = false;

            // ---- Temperatura ----
            if (data.temperature && Array.isArray(data.temperature) && data.temperature.length > 0) {
                tempVal = parseFloat(data.temperature[0][1]);
                systemHealth.tempValid = isValidValue(tempVal, -50, 100);
                if (systemHealth.tempValid) {
                    gaugeTemp.refresh(tempVal);
                    checkLimits('Temp', 'temperatura', tempVal, THRESHOLDS.temperature);
                    hasValidData = true;
                } else {
                    gaugeTemp.refresh(0);
                    setSensorBadgeOffline('Temp', 'Temperatura');
                    tempVal = null;
                }
            } else {
                systemHealth.tempValid = false;
                gaugeTemp.refresh(0);
                setSensorBadgeOffline('Temp', 'Temperatura');
                tempVal = null;
            }

            // ---- pH ----
            if (data.ph && Array.isArray(data.ph) && data.ph.length > 0) {
                phVal = parseFloat(data.ph[0][1]);
                systemHealth.phValid = isValidValue(phVal, 0, 14);
                if (systemHealth.phValid) {
                    gaugePh.refresh(phVal);
                    checkLimits('Ph', 'pH', phVal, THRESHOLDS.ph);
                    hasValidData = true;
                } else {
                    gaugePh.refresh(0);
                    setSensorBadgeOffline('Ph', 'pH');
                    phVal = null;
                }
            } else {
                systemHealth.phValid = false;
                gaugePh.refresh(0);
                setSensorBadgeOffline('Ph', 'pH');
                phVal = null;
            }

            // ---- Oxígeno ----
            if (data.oxygen && Array.isArray(data.oxygen) && data.oxygen.length > 0) {
                oxyVal = parseFloat(data.oxygen[0][1]);
                systemHealth.oxyValid = isValidValue(oxyVal, 0, 20);
                if (systemHealth.oxyValid) {
                    gaugeOxy.refresh(oxyVal);
                    checkLimits('Oxy', 'Oxígeno', oxyVal, THRESHOLDS.oxygen);
                    hasValidData = true;
                } else {
                    gaugeOxy.refresh(0);
                    setSensorBadgeOffline('Oxy', 'Oxígeno');
                    oxyVal = null;
                }
            } else {
                systemHealth.oxyValid = false;
                gaugeOxy.refresh(0);
                setSensorBadgeOffline('Oxy', 'Oxígeno');
                oxyVal = null;
            }

            // Actualizar estado general
            evaluateOverallSystemStatus();

            // 🔥 ACTUALIZAR GRÁFICO - Solo si hay datos válidos
            if (hasValidData) {
                updateChart(timeStr, tempVal, phVal, oxyVal);
                document.getElementById('chartStatus').textContent =
                    `📊 ${telemetryChart.data.labels.length} puntos | ✅ Datos recientes`;
            } else {
                document.getElementById('chartStatus').textContent = '⏳ Sin datos válidos...';
            }
        }

        function isValidValue(val, min, max) {
            return val !== null &&
                   val !== undefined &&
                   !isNaN(val) &&
                   isFinite(val) &&
                   val >= min &&
                   val <= max;
        }

        // ============================================================
        //  LIMPIEZA DE GAUGES (OFFLINE)
        // ============================================================
        function clearAllGaugesToOffline() {
            systemHealth.tempValid = false;
            systemHealth.phValid = false;
            systemHealth.oxyValid = false;

            if (gaugeTemp) gaugeTemp.refresh(0);
            if (gaugePh) gaugePh.refresh(0);
            if (gaugeOxy) gaugeOxy.refresh(0);

            setSensorBadgeOffline('Temp', 'Temperatura');
            setSensorBadgeOffline('Ph', 'pH');
            setSensorBadgeOffline('Oxy', 'Oxígeno');

            // 🔥 LIMPIAR GRÁFICO CUANDO NO HAY DATOS
            clearChart();
            document.getElementById('chartStatus').textContent = '⏳ Sin datos - sensores offline';
        }

        function setSensorBadgeOffline(idSuffix, name) {
            const badge = document.getElementById(`status${idSuffix}`);
            badge.innerHTML = `<span class="icon">🔴</span> Desconectado`;
            badge.className = "status-badge offline";

            const card = document.getElementById(`card${idSuffix}`);
            if (card) {
                card.className = 'card status-offline';
            }

            if (previousStates[idSuffix] !== 'offline') {
                pushAlert(`⚠️ Sensor ${name} desconectado`, 'bad');
                previousStates[idSuffix] = 'offline';
            }
        }

        // ============================================================
        //  ACTUALIZACIÓN DE ESTADO
        // ============================================================
        function updateStatus(state, text) {
            const dot = document.getElementById("statusDot");
            const textEl = document.getElementById("statusText");

            textEl.textContent = text;
            dot.className = "dot";

            if (state === 'online') {
                dot.classList.add("online");
                textEl.className = "status-text online";
            } else if (state === 'warning') {
                dot.classList.add("warning");
                textEl.className = "status-text warning";
            } else if (state === 'bad') {
                dot.classList.add("bad");
                textEl.className = "status-text bad";
            } else {
                dot.classList.add("offline");
                textEl.className = "status-text offline";
            }
        }

        function evaluateOverallSystemStatus() {
            if (!systemHealth.wsConnected) {
                updateStatus('bad', "Servidor desconectado");
                return;
            }

            const allValid = systemHealth.tempValid && systemHealth.phValid && systemHealth.oxyValid;
            const anyValid = systemHealth.tempValid || systemHealth.phValid || systemHealth.oxyValid;

            if (allValid) {
                updateStatus('online', "✅ Sistema en vivo");
            } else if (anyValid) {
                updateStatus('warning', "⚠️ Fallo parcial de sensores");
            } else {
                updateStatus('bad', "❌ Todos los sensores offline");
            }
        }

        // ============================================================
        //  VERIFICACIÓN DE LÍMITES
        // ============================================================
        function checkLimits(idSuffix, name, val, thresholds) {
            const badge = document.getElementById(`status${idSuffix}`);
            const card = document.getElementById(`card${idSuffix}`);
            const formattedVal = val.toFixed(2);
            const unit = thresholds.unit ? ` ${thresholds.unit}` : '';

            let currentState;
            let statusText = '';
            let icon = '';

            if (val >= thresholds.minOk && val <= thresholds.maxOk) {
                currentState = 'ok';
                icon = '✅';
                statusText = `Normal (${formattedVal}${unit})`;
            } else if ((val >= thresholds.minWarn && val < thresholds.minOk) ||
                       (val > thresholds.maxOk && val <= thresholds.maxWarn)) {
                currentState = 'warn';
                icon = '⚠️';
                statusText = `Advertencia (${formattedVal}${unit})`;
            } else {
                currentState = 'bad';
                icon = '🚨';
                statusText = `Crítico (${formattedVal}${unit})`;
            }

            badge.innerHTML = `<span class="icon">${icon}</span> ${statusText}`;
            badge.className = `status-badge ${currentState}`;

            if (card) {
                card.className = `card status-${currentState}`;
            }

            if (previousStates[idSuffix] !== currentState) {
                if (currentState === 'warn') {
                    pushAlert(`⚠️ Advertencia en ${name}: ${formattedVal}${unit}`, 'warn');
                } else if (currentState === 'bad') {
                    pushAlert(`🚨 Alerta crítica en ${name}: ${formattedVal}${unit}`, 'bad');
                    playAlarmSound();
                } else if (currentState === 'ok' && previousStates[idSuffix] !== null) {
                    pushAlert(`✅ ${name} normalizado: ${formattedVal}${unit}`, 'ok');
                    playOkSound();
                }
                previousStates[idSuffix] = currentState;
            }
        }

        // ============================================================
        //  ALERTAS
        // ============================================================
       // ============================================================
//  ALERTAS - LIMITADO A 10 ITEMS CON BOTÓN DE LIMPIEZA
// ============================================================
function pushAlert(message, type = 'bad') {
    const list = document.getElementById("alertsList");
    const badge = document.getElementById("alertBadge");

    // Eliminar mensaje vacío si existe
    if (alertCounter === 0) {
        const empty = list.querySelector('.alert-empty');
        if (empty) empty.remove();
    }

    alertCounter++;
    // 🔥 LIMITAR EL CONTADOR A 10
    const displayCount = Math.min(alertCounter, 10);
    badge.textContent = displayCount;

    // Color del badge según el tipo
    badge.className = 'badge-count';
    if (type === 'bad') badge.classList.add('bad');
    else if (type === 'warn') badge.classList.add('warn');
    else badge.classList.add('ok');

    const time = new Date().toLocaleTimeString([], { 
        hour: '2-digit', 
        minute: '2-digit', 
        second: '2-digit' 
    });

    const item = document.createElement("div");
    let alertClass = "alert-item";
    if (type === 'warn') alertClass += " warn-alert";
    else if (type === 'ok') alertClass += " ok-alert";

    item.className = alertClass;
    item.innerHTML = `
        <div class="alert-message">${message}</div>
        <div class="timestamp">🕐 ${time}</div>
    `;

    list.prepend(item);

    // 🔥 MANTENER EXACTAMENTE 10 ITEMS
    const items = list.querySelectorAll(".alert-item");
    while (items.length > 10) {
        items[items.length - 1].remove();
    }

    // Si no hay items, mostrar mensaje vacío
    if (items.length === 0) {
        const empty = document.createElement("div");
        empty.className = "alert-empty";
        empty.textContent = "✅ Sin eventos registrados";
        list.appendChild(empty);
    }
}

// ============================================================
//  LIMPIAR ALERTAS
// ============================================================
function clearAlerts() {
    const list = document.getElementById("alertsList");
    const badge = document.getElementById("alertBadge");
    
    // Limpiar la lista
    list.innerHTML = '<div class="alert-empty">✅ Sin eventos registrados</div>';
    
    // Resetear contador
    alertCounter = 0;
    badge.textContent = "0";
    badge.className = "badge-count ok";
}
        // ============================================================
        //  ACTUALIZACIÓN DEL GRÁFICO (CORREGIDO)
        // ============================================================
        function updateChart(time, temp, ph, oxy) {
            if (!time) return;

            if (telemetryChart.data.labels.length >= maxChartPoints) {
                telemetryChart.data.labels.shift();
                telemetryChart.data.datasets.forEach(dataset => dataset.data.shift());
            }

            telemetryChart.data.labels.push(time);

            // 🔥 USAR null en lugar de 0 para valores inválidos
            telemetryChart.data.datasets[0].data.push(
                (temp !== null && temp !== undefined && !isNaN(temp)) ? temp : null
            );
            telemetryChart.data.datasets[1].data.push(
                (ph !== null && ph !== undefined && !isNaN(ph)) ? ph : null
            );
            telemetryChart.data.datasets[2].data.push(
                (oxy !== null && oxy !== undefined && !isNaN(oxy)) ? oxy : null
            );

            telemetryChart.update('none');
        }

        // ============================================================
        //  LIMPIAR GRÁFICO COMPLETAMENTE
        // ============================================================
        function clearChart() {
            if (!telemetryChart) return;

            telemetryChart.data.labels = [];
            telemetryChart.data.datasets.forEach(dataset => {
                dataset.data = [];
            });
            telemetryChart.update('none');

            document.getElementById('chartStatus').textContent = '🗑️ Gráfico limpiado';
            pushAlert('🗑️ Gráfico de datos limpiado manualmente', 'ok');
        }

        // ============================================================
        //  WATCHDOG DE DATOS
        // ============================================================
        function resetDataWatchdog() {
            clearTimeout(dataWatchdogTimer);
            dataWatchdogTimer = setTimeout(() => {
                if (Date.now() - systemHealth.lastDataTime > DATA_TIMEOUT_MS) {
                    clearAllGaugesToOffline();
                    evaluateOverallSystemStatus();
                    pushAlert('⏰ Timeout: No se reciben datos del servidor', 'warn');
                }
            }, DATA_TIMEOUT_MS);
        }

        // ============================================================
        //  LOADING OVERLAY
        // ============================================================
        function showLoading(active, text = 'Conectando...') {
            const overlay = document.getElementById('loadingOverlay');
            const textEl = overlay.querySelector('.loading-text');
            if (textEl) textEl.textContent = text;
            overlay.classList.toggle('active', active);
        }

        // ============================================================
        //  INICIALIZACIÓN
        // ============================================================
        console.log('🌊 SCADA - Calidad del Agua v2.1');
        console.log('📡 Conectando a ThingsBoard...');
        console.log('🔧 Características:');
        console.log('  ✅ Manejo de datos nulos (null)');
        console.log('  ✅ Limpieza automática del gráfico');
        console.log('  ✅ Reinicio al reconectar');
        console.log('  ✅ Indicadores de estado mejorados');
    </script>
