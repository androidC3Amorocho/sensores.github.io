<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Telemetría de calidad del agua</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/raphael/2.3.0/raphael.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/justgage/1.6.1/justgage.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --bg-color: #0b0f1a;
            --card-bg: #12182b;
            --panel-bg: #1a2238;
            --ok-color: #00ff88;
            --warn-color: #ffd000;
            --bad-color: #ff4d4d;
            --text-muted: #8892b0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-color);
            color: #fff;
            padding: 12px;
            overflow-x: hidden;
        }

        header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            max-width: 1300px;
            margin: 0 auto 15px auto;
            border-bottom: 1px solid #1e2942;
            padding-bottom: 12px;
            gap: 10px;
        }

        h2 { font-size: 1.25em; letter-spacing: 0.5px; }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.8em;
            background: rgba(255, 255, 255, 0.05);
            padding: 4px 10px;
            border-radius: 12px;
        }

        .dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background-color: var(--bad-color);
            box-shadow: 0 0 6px var(--bad-color);
        }

        .dot.online {
            background-color: var(--ok-color);
            box-shadow: 0 0 6px var(--ok-color);
        }

        .dot.warning {
            background-color: var(--warn-color);
            box-shadow: 0 0 6px var(--warn-color);
        }

        .btn-action {
            background: #232d47;
            color: #fff;
            border: 1px solid #3b486b;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8em;
        }

        .btn-action:hover { background: #2e3a59; }

        .main-layout {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            max-width: 1300px;
            margin: 0 auto;
        }

        @media (min-width: 992px) {
            .main-layout { grid-template-columns: 3fr 1fr; }
        }

        .left-column {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            min-width: 0;
        }

        .gauges-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            width: 100%;
        }

        @media (min-width: 600px) {
            .gauges-grid { grid-template-columns: repeat(3, 1fr); }
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            border: 1px solid #1e2942;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .gauge-title {
            font-size: 1.1em;
            font-weight: 600;
            color: #00e5ff;
            margin-bottom: 5px;
            letter-spacing: 0.8px;
        }

        .gauge-wrapper {
            width: 100%;
            max-width: 260px;
            height: 160px;
            position: relative;
        }

        .status-badge {
            margin-top: 5px;
            padding: 6px 14px;
            border-radius: 12px;
            font-size: 0.85em;
            font-weight: bold;
            text-align: center;
            width: 100%;
            max-width: 260px;
            transition: all 0.3s ease;
        }

        .ok { background: rgba(0, 255, 136, 0.15); color: var(--ok-color); border: 1px solid var(--ok-color); }
        .warn { background: rgba(255, 208, 0, 0.15); color: var(--warn-color); border: 1px solid var(--warn-color); }
        .bad { background: rgba(255, 77, 77, 0.15); color: var(--bad-color); border: 1px solid var(--bad-color); }
        .offline { background: rgba(255, 77, 77, 0.15); color: var(--bad-color); border: 1px solid var(--bad-color); }

        .chart-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 12px;
            border: 1px solid #1e2942;
            position: relative;
            width: 100%;
            height: 250px;
            min-width: 0;
        }

        .alerts-panel {
            background: var(--card-bg);
            border: 1px solid #1e2942;
            border-radius: 12px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            max-height: 300px;
        }

        @media (min-width: 992px) {
            .alerts-panel { max-height: 100%; }
        }

        .alerts-header {
            font-size: 0.9em;
            font-weight: bold;
            margin-bottom: 8px;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .alerts-list {
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .alert-item {
            background: #1a2238;
            border-left: 3px solid var(--bad-color);
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 0.8em;
        }

        .alert-item.warn-alert {
            border-left-color: var(--warn-color);
        }

        .alert-item .timestamp {
            font-size: 0.7em;
            color: var(--text-muted);
            margin-top: 2px;
        }
    </style>
</head>
<body>

    <header>
        <h2>🌊 Telemetría de calidad del agua</h2>
        <div class="header-controls">
            <button id="btnMute" class="btn-action" onclick="toggleMute()">🔊 Sonido</button>
            <div class="status-indicator">
                <div id="statusDot" class="dot"></div>
                <span id="statusText">Autenticando...</span>
            </div>
        </div>
    </header>

    <div class="main-layout">
        <div class="left-column">
            <div class="gauges-grid">
                <div class="card">
                    <div class="gauge-title">Temperatura</div>
                    <div class="gauge-wrapper"><div id="gaugeTemp"></div></div>
                    <div id="statusTemp" class="status-badge offline">Desconectado</div>
                </div>
                <div class="card">
                    <div class="gauge-title" style="color: #ffd000;">pH</div>
                    <div class="gauge-wrapper"><div id="gaugePh"></div></div>
                    <div id="statusPh" class="status-badge offline">Desconectado</div>
                </div>
                <div class="card">
                    <div class="gauge-title" style="color: #00ff88;">Oxígeno disuelto</div>
                    <div class="gauge-wrapper"><div id="gaugeOxy"></div></div>
                    <div id="statusOxy" class="status-badge offline">Desconectado</div>
                </div>
            </div>

            <div class="chart-card">
                <canvas id="telemetryChart"></canvas>
            </div>
        </div>

        <div class="alerts-panel">
            <div class="alerts-header">
                <span>⚠️ Registro de alertas</span>
                <small id="alertCount">0</small>
            </div>
            <div id="alertsList" class="alerts-list">
                <div style="color: var(--text-muted); font-size: 0.8em; text-align: center; margin-top: 15px;">
                    Sin eventos.
                </div>
            </div>
        </div>
    </div>

    <script>
        const TB_HOST = "thingsboard.cloud";
        const DEVICE_ID = "0d580f10-a62d-11f1-9b46-e7fbeb690c95";
        
        // Credenciales de ThingsBoard
        const TB_USER = "scada-viewer@tuempresa.com";
        const TB_PASSWORD = "9b46-e7fbeb690c95";

        let gaugeTemp, gaugePh, gaugeOxy, telemetryChart;
        let jwtToken = null;
        let webSocket = null;
        let alertCounter = 0;
        let isMuted = false;
        const maxChartPoints = 20;

        let dataWatchdogTimer = null;
        const DATA_TIMEOUT_MS = 20000;

        // Estado de conexión de sensores
        const sensorStatus = {
            temp: { connected: false, value: null },
            ph: { connected: false, value: null },
            oxy: { connected: false, value: null }
        };

        let audioCtx = null;

        function playAlarmSound() {
            if (isMuted) return;
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(880, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        }

        function toggleMute() {
            isMuted = !isMuted;
            document.getElementById("btnMute").innerText = isMuted ? "🔇 Silenciado" : "🔊 Sonido";
        }

        window.onload = async () => {
            initGauges();
            initChart();
            await loginAndConnect();
        };

        function initGauges() {
            gaugeTemp = new JustGage({
                id: "gaugeTemp", value: 0, min: 0, max: 50, label: "°C",
                gaugeColor: "#1e2942", levelColors: ["#00e5ff", "#00ff88", "#ff4d4d"],
                valueFontColor: "#fff", labelFontColor: "#8892b0",
                donut: true,
                hideMinMax: true
            });
            gaugePh = new JustGage({
                id: "gaugePh", value: 0, min: 0, max: 14, label: "pH",
                gaugeColor: "#1e2942", levelColors: ["#ff4d4d", "#00ff88", "#ff4d4d"],
                valueFontColor: "#fff", labelFontColor: "#8892b0",
                donut: true,
                hideMinMax: true
            });
            gaugeOxy = new JustGage({
                id: "gaugeOxy", value: 0, min: 0, max: 12, label: "mg/L",
                gaugeColor: "#1e2942", levelColors: ["#ff4d4d", "#ffd000", "#00ff88"],
                valueFontColor: "#fff", labelFontColor: "#8892b0",
                donut: true,
                hideMinMax: true
            });
        }

        function initChart() {
            const ctx = document.getElementById('telemetryChart').getContext('2d');
            telemetryChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [
                        { label: 'Temperatura (°C)', borderColor: '#00e5ff', data: [], tension: 0.3, pointRadius: 3, spanGaps: false },
                        { label: 'pH', borderColor: '#ffd000', data: [], tension: 0.3, pointRadius: 3, spanGaps: false },
                        { label: 'Oxígeno (mg/L)', borderColor: '#00ff88', data: [], tension: 0.3, pointRadius: 3, spanGaps: false }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        x: { ticks: { color: '#8892b0', font: { size: 10 } }, grid: { color: '#1e2942' } },
                        y: { ticks: { color: '#8892b0', font: { size: 10 } }, grid: { color: '#1e2942' } }
                    },
                    plugins: { legend: { labels: { color: '#fff', font: { size: 11 }, boxWidth: 12 } } }
                }
            });
        }

        async function loginAndConnect() {
            try {
                const loginRes = await fetch(`https://${TB_HOST}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: TB_USER, password: TB_PASSWORD })
                });

                if (!loginRes.ok) throw new Error("Credenciales inválidas");

                const loginData = await loginRes.json();
                jwtToken = loginData.token;

                updateStatus('warning', "Conectando al servidor...");
                connectWebSocket(jwtToken);

            } catch (err) {
                updateStatus('bad', "Error de autenticación");
                console.error("Error en inicio de sesión:", err);
                setTimeout(loginAndConnect, 10000);
            }
        }

        function connectWebSocket(token) {
            const wsUrl = `wss://${TB_HOST}/api/ws/plugins/telemetry?token=${token}`;
            webSocket = new WebSocket(wsUrl);

            webSocket.onopen = () => {
                updateStatus('warning', "Esperando telemetría...");
                const subCmd = {
                    tsSubCmds: [
                        {
                            entityType: "DEVICE",
                            entityId: DEVICE_ID,
                            scope: "LATEST_TELEMETRY",
                            cmdId: 1
                        }
                    ]
                };
                webSocket.send(JSON.stringify(subCmd));
            };

            webSocket.onmessage = (event) => {
                try {
                    const msg = JSON.parse(event.data);
                    if (msg.data) {
                        resetDataWatchdog();
                        processTelemetry(msg.data);
                    }
                } catch (e) {
                    console.error("Error procesando mensaje:", e);
                }
            };

            webSocket.onclose = () => {
                clearTimeout(dataWatchdogTimer);
                setAllSensorsOffline();
                updateStatus('bad', "Servidor desconectado - reconectando...");
                setTimeout(loginAndConnect, 5000);
            };

            webSocket.onerror = (err) => {
                console.error("Error en WebSocket:", err);
                webSocket.close();
            };
        }

        function resetDataWatchdog() {
            clearTimeout(dataWatchdogTimer);
            dataWatchdogTimer = setTimeout(() => {
                setAllSensorsOffline();
                updateStatus('bad', "Timeout - sensores sin datos");
            }, DATA_TIMEOUT_MS);
        }

        function setAllSensorsOffline() {
            sensorStatus.temp.connected = false;
            sensorStatus.ph.connected = false;
            sensorStatus.oxy.connected = false;
            
            updateSensorBadge('Temp', false, null, 'temperatura');
            updateSensorBadge('Ph', false, null, 'pH');
            updateSensorBadge('Oxy', false, null, 'oxígeno');
            
            // Resetear gauges
            if (gaugeTemp) gaugeTemp.refresh(0);
            if (gaugePh) gaugePh.refresh(0);
            if (gaugeOxy) gaugeOxy.refresh(0);
        }

        function updateStatus(state, text) {
            const dot = document.getElementById("statusDot");
            document.getElementById("statusText").innerText = text;
            
            dot.className = "dot";
            if (state === 'online') dot.classList.add("online");
            else if (state === 'warning') dot.classList.add("warning");
        }

        function processTelemetry(data) {
            const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            
            // --- PROCESAR TEMPERATURA ---
            let tempConnected = false;
            let tempValue = null;
            
            if (data.temp_connected !== undefined) {
                tempConnected = data.temp_connected === true || data.temp_connected === "true";
            }
            
            if (data.temperature && data.temperature[0] && data.temperature[0][1] !== null) {
                tempValue = parseFloat(data.temperature[0][1]);
                if (tempValue === -127.0) tempConnected = false;
            }
            
            sensorStatus.temp.connected = tempConnected;
            sensorStatus.temp.value = tempValue;
            
            if (tempConnected && tempValue !== null) {
                gaugeTemp.refresh(tempValue > 0 ? tempValue : 0);
                checkLimits("Temp", "temperatura", tempValue, 18, 20, 28, 32, "°C");
            } else {
                gaugeTemp.refresh(0);
                updateSensorBadge("Temp", false, null, "temperatura");
            }

            // --- PROCESAR pH ---
            let phConnected = false;
            let phValue = null;
            
            if (data.ph_connected !== undefined) {
                phConnected = data.ph_connected === true || data.ph_connected === "true";
            }
            
            if (data.ph && data.ph[0] && data.ph[0][1] !== null) {
                phValue = parseFloat(data.ph[0][1]);
            }
            
            sensorStatus.ph.connected = phConnected;
            sensorStatus.ph.value = phValue;
            
            if (phConnected && phValue !== null) {
                gaugePh.refresh(phValue);
                checkLimits("Ph", "pH", phValue, 6.0, 6.5, 8.5, 9.0, "");
            } else {
                gaugePh.refresh(0);
                updateSensorBadge("Ph", false, null, "pH");
            }

            // --- PROCESAR OXÍGENO ---
            let oxyConnected = false;
            let oxyValue = null;
            
            if (data.oxygen_connected !== undefined) {
                oxyConnected = data.oxygen_connected === true || data.oxygen_connected === "true";
            }
            
            if (data.oxygen && data.oxygen[0] && data.oxygen[0][1] !== null) {
                oxyValue = parseFloat(data.oxygen[0][1]);
            }
            
            sensorStatus.oxy.connected = oxyConnected;
            sensorStatus.oxy.value = oxyValue;
            
            if (oxyConnected && oxyValue !== null) {
                gaugeOxy.refresh(oxyValue);
                checkLimits("Oxy", "oxígeno", oxyValue, 3.0, 5.0, 12.0, 15.0, "mg/L");
            } else {
                gaugeOxy.refresh(0);
                updateSensorBadge("Oxy", false, null, "oxígeno");
            }

            // Evaluar estado general del sistema
            evaluateOverallSystemStatus();

            // Actualizar gráfica
            updateChart(
                timeStr,
                tempConnected && tempValue !== null ? tempValue : null,
                phConnected && phValue !== null ? phValue : null,
                oxyConnected && oxyValue !== null ? oxyValue : null
            );
        }

        function updateSensorBadge(idSuffix, connected, value, name) {
            const badge = document.getElementById(`status${idSuffix}`);
            
            if (!connected) {
                badge.innerText = "Desconectado";
                badge.className = "status-badge offline";
                return;
            }
            
            // Si está conectado, mostrar el valor
            if (value !== null && value !== undefined) {
                badge.innerText = `${value.toFixed(1)}`;
                // La clase se actualizará en checkLimits
            }
        }

        function evaluateOverallSystemStatus() {
            const anyConnected = sensorStatus.temp.connected || sensorStatus.ph.connected || sensorStatus.oxy.connected;
            const allConnected = sensorStatus.temp.connected && sensorStatus.ph.connected && sensorStatus.oxy.connected;
            const allDisconnected = !sensorStatus.temp.connected && !sensorStatus.ph.connected && !sensorStatus.oxy.connected;

            if (allConnected) {
                updateStatus('online', "Sistema en línea");
            } else if (anyConnected) {
                updateStatus('warning', "Falla parcial de sensores");
            } else {
                updateStatus('bad', "Todos los sensores desconectados");
            }
        }

        function updateChart(time, temp, ph, oxy) {
            if (telemetryChart.data.labels.length >= maxChartPoints) {
                telemetryChart.data.labels.shift();
                telemetryChart.data.datasets.forEach(dataset => dataset.data.shift());
            }

            telemetryChart.data.labels.push(time);
            telemetryChart.data.datasets[0].data.push(temp);
            telemetryChart.data.datasets[1].data.push(ph);
            telemetryChart.data.datasets[2].data.push(oxy);
            telemetryChart.update('none');
        }

        function checkLimits(idSuffix, name, val, minWarn, minOk, maxOk, maxWarn, unit) {
            const badge = document.getElementById(`status${idSuffix}`);
            let currentState = 'ok';
            const formattedVal = val.toFixed(1);

            if (val >= minOk && val <= maxOk) {
                badge.innerText = `OK (${formattedVal} ${unit})`.trim();
                badge.className = "status-badge ok";
                currentState = 'ok';
            } else if ((val >= minWarn && val < minOk) || (val > maxOk && val <= maxWarn)) {
                badge.innerText = `Advertencia (${formattedVal} ${unit})`.trim();
                badge.className = "status-badge warn";
                currentState = 'warn';
                pushAlert(`⚠️ Advertencia en ${name}: ${formattedVal} ${unit}`.trim(), 'warn');
            } else {
                badge.innerText = `Crítico (${formattedVal} ${unit})`.trim();
                badge.className = "status-badge bad";
                currentState = 'bad';
                pushAlert(`🚨 Alerta crítica en ${name}: ${formattedVal} ${unit}`.trim(), 'bad');
                playAlarmSound();
            }
        }

        function pushAlert(message, type = 'bad') {
            const list = document.getElementById("alertsList");
            const count = document.getElementById("alertCount");

            if (alertCounter === 0) list.innerHTML = "";
            alertCounter++;
            count.innerText = alertCounter;

            const time = new Date().toLocaleTimeString();
            const item = document.createElement("div");
            
            let alertClass = "alert-item";
            if (type === 'warn') alertClass += " warn-alert";

            item.className = alertClass;
            item.innerHTML = `<div>${message}</div><div class="timestamp">${time}</div>`;

            list.prepend(item);

            // Limitar a 10 alertas
            const items = list.querySelectorAll(".alert-item");
            if (items.length > 10) {
                items[items.length - 1].remove();
            }
        }
    </script>
</body>
</html>
