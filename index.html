<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Telemetría Calidad del Agua</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/raphael/2.3.0/raphael.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/justgage/1.6.1/justgage.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --bg-color: #0b0f1a;
            --card-bg: #12182b;
            --panel-bg: #1a2238;
            --ok-color: #00ff88;
            --warn-color: #ffd000;
            --bad-color: #ff4d4d;
            --text-muted: #8892b0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-color);
            color: #fff;
            padding: 12px;
            overflow-x: hidden;
        }

        header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            max-width: 1300px;
            margin: 0 auto 15px auto;
            border-bottom: 1px solid #1e2942;
            padding-bottom: 12px;
            gap: 10px;
        }

        h2 { font-size: 1.25em; letter-spacing: 0.5px; }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.8em;
            background: rgba(255, 255, 255, 0.05);
            padding: 4px 10px;
            border-radius: 12px;
        }

        .dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background-color: var(--bad-color);
            box-shadow: 0 0 6px var(--bad-color);
        }

        .dot.online {
            background-color: var(--ok-color);
            box-shadow: 0 0 6px var(--ok-color);
        }

        .btn-action {
            background: #232d47;
            color: #fff;
            border: 1px solid #3b486b;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8em;
        }

        .btn-action:hover { background: #2e3a59; }

        .main-layout {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            max-width: 1300px;
            margin: 0 auto;
        }

        @media (min-width: 992px) {
            .main-layout { grid-template-columns: 3fr 1fr; }
        }

        .left-column {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            min-width: 0;
        }

        .gauges-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            width: 100%;
        }

        @media (min-width: 600px) {
            .gauges-grid { grid-template-columns: repeat(3, 1fr); }
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            border: 1px solid #1e2942;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .gauge-title {
            font-size: 1.1em;
            font-weight: 600;
            color: #00e5ff;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .gauge-wrapper {
            width: 100%;
            max-width: 260px;
            height: 160px;
            position: relative;
        }

        .status-badge {
            margin-top: 5px;
            padding: 6px 14px;
            border-radius: 12px;
            font-size: 0.85em;
            font-weight: bold;
            text-transform: uppercase;
            text-align: center;
            width: 100%;
            max-width: 260px;
        }

        .ok { background: rgba(0, 255, 136, 0.15); color: var(--ok-color); border: 1px solid var(--ok-color); }
        .bad { background: rgba(255, 77, 77, 0.15); color: var(--bad-color); border: 1px solid var(--bad-color); }

        .chart-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 12px;
            border: 1px solid #1e2942;
            position: relative;
            width: 100%;
            height: 250px;
            min-width: 0;
        }

        .alerts-panel {
            background: var(--card-bg);
            border: 1px solid #1e2942;
            border-radius: 12px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            max-height: 300px;
        }

        @media (min-width: 992px) {
            .alerts-panel { max-height: 100%; }
        }

        .alerts-header {
            font-size: 0.9em;
            font-weight: bold;
            margin-bottom: 8px;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .alerts-list {
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .alert-item {
            background: #1a2238;
            border-left: 3px solid var(--bad-color);
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 0.8em;
        }

        .alert-item .timestamp {
            font-size: 0.7em;
            color: var(--text-muted);
            margin-top: 2px;
        }
    </style>
</head>
<body>

    <header>
        <h2>🌊 Telemetría Calidad del Agua</h2>
        <div class="header-controls">
            <button id="btnMute" class="btn-action" onclick="toggleMute()">🔊 Sonido</button>
            <div class="status-indicator">
                <div id="statusDot" class="dot"></div>
                <span id="statusText">Autenticando...</span>
            </div>
        </div>
    </header>

    <div class="main-layout">
        <div class="left-column">
            <div class="gauges-grid">
                <div class="card">
                    <div class="gauge-title">Temperatura</div>
                    <div class="gauge-wrapper"><div id="gaugeTemp"></div></div>
                    <div id="statusTemp" class="status-badge ok">Sin Datos</div>
                </div>
                <div class="card">
                    <div class="gauge-title" style="color: #ffd000;">pH</div>
                    <div class="gauge-wrapper"><div id="gaugePh"></div></div>
                    <div id="statusPh" class="status-badge ok">Sin Datos</div>
                </div>
                <div class="card">
                    <div class="gauge-title" style="color: #00ff88;">Oxígeno Disuelto</div>
                    <div class="gauge-wrapper"><div id="gaugeOxy"></div></div>
                    <div id="statusOxy" class="status-badge ok">Sin Datos</div>
                </div>
            </div>

            <div class="chart-card">
                <canvas id="telemetryChart"></canvas>
            </div>
        </div>

        <div class="alerts-panel">
            <div class="alerts-header">
                <span>⚠️ Registro de Alertas</span>
                <small id="alertCount">0</small>
            </div>
            <div id="alertsList" class="alerts-list">
                <div style="color: var(--text-muted); font-size: 0.8em; text-align: center; margin-top: 15px;">
                    Sin eventos.
                </div>
            </div>
        </div>
    </div>

    <script>
        // CONFIGURACIÓN DE THINGSBOARD
        const TB_HOST = "thingsboard.cloud";
        const DEVICE_ID = "0d580f10-a62d-11f1-9b46-e7fbeb690c95";
        
        // Coloca tu correo y clave de usuario de ThingsBoard Cloud
        const TB_USER = "scada-viewer@tuempresa.com";
        const TB_PASSWORD = "9b46-e7fbeb690c95";

        let gaugeTemp, gaugePh, gaugeOxy, telemetryChart;
        let jwtToken = null;
        let webSocket = null;
        let alertCounter = 0;
        let isMuted = false;
        const maxChartPoints = 15;

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playAlarmSound() {
            if (isMuted) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(880, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        }

        function toggleMute() {
            isMuted = !isMuted;
            document.getElementById("btnMute").innerText = isMuted ? "🔇 Mute" : "🔊 Sonido";
        }

        window.onload = async () => {
            initGauges();
            initChart();
            await loginAndConnect();
        };

        function initGauges() {
            gaugeTemp = new JustGage({
                id: "gaugeTemp", value: 0, min: 0, max: 50, label: "°C",
                gaugeColor: "#1e2942", levelColors: ["#00e5ff", "#00ff88", "#ff4d4d"],
                valueFontColor: "#fff", labelFontColor: "#8892b0"
            });
            gaugePh = new JustGage({
                id: "gaugePh", value: 0, min: 0, max: 14, label: "pH",
                gaugeColor: "#1e2942", levelColors: ["#ff4d4d", "#00ff88", "#ff4d4d"],
                valueFontColor: "#fff", labelFontColor: "#8892b0"
            });
            gaugeOxy = new JustGage({
                id: "gaugeOxy", value: 0, min: 0, max: 12, label: "mg/L",
                gaugeColor: "#1e2942", levelColors: ["#ff4d4d", "#ffd000", "#00ff88"],
                valueFontColor: "#fff", labelFontColor: "#8892b0"
            });
        }

        function initChart() {
            const ctx = document.getElementById('telemetryChart').getContext('2d');
            telemetryChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [
                        { label: 'Temp', borderColor: '#00e5ff', data: [], tension: 0.3, pointRadius: 2 },
                        { label: 'pH', borderColor: '#ffd000', data: [], tension: 0.3, pointRadius: 2 },
                        { label: 'O2', borderColor: '#00ff88', data: [], tension: 0.3, pointRadius: 2 }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        x: { ticks: { color: '#8892b0', font: { size: 10 } }, grid: { color: '#1e2942' } },
                        y: { ticks: { color: '#8892b0', font: { size: 10 } }, grid: { color: '#1e2942' } }
                    },
                    plugins: { legend: { labels: { color: '#fff', font: { size: 11 }, boxWidth: 12 } } }
                }
            });
        }

        async function loginAndConnect() {
            try {
                // 1. Obtener Token JWT mediante login REST (Soporta CORS nativamente)
                const loginRes = await fetch(`https://${TB_HOST}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: TB_USER, password: TB_PASSWORD })
                });

                if (!loginRes.ok) throw new Error("Credenciales inválidas o error de autenticación");

                const loginData = await loginRes.json();
                jwtToken = loginData.token;

                updateStatus(true, "Conectando WebSocket...");
                connectWebSocket(jwtToken);

            } catch (err) {
                updateStatus(false, "Error Login");
                console.error("Error en login:", err);
            }
        }

        function connectWebSocket(token) {
            // 2. Conexión WebSocket autenticada por Token JWT con soporte CORS
            const wsUrl = `wss://${TB_HOST}/api/ws/plugins/telemetry?token=${token}`;
            webSocket = new WebSocket(wsUrl);

            webSocket.onopen = () => {
                updateStatus(true, "Live (WS JWT)");
                
                // Suscribirse a la telemetría del dispositivo
                const subCmd = {
                    tsSubCmds: [
                        {
                            entityType: "DEVICE",
                            entityId: DEVICE_ID,
                            scope: "LATEST_TELEMETRY",
                            cmdId: 1
                        }
                    ]
                };
                webSocket.send(JSON.stringify(subCmd));
            };

            webSocket.onmessage = (event) => {
                const msg = JSON.parse(event.data);
                if (msg.data) processTelemetry(msg.data);
            };

            webSocket.onclose = () => {
                updateStatus(false, "Reconectando...");
                setTimeout(loginAndConnect, 5000);
            };

            webSocket.onerror = (err) => console.error("Error WebSocket:", err);
        }

        function updateStatus(isOnline, text) {
            const dot = document.getElementById("statusDot");
            document.getElementById("statusText").innerText = text;
            if (isOnline) dot.classList.add("online");
            else dot.classList.remove("online");
        }

        function processTelemetry(data) {
            const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            let tempVal = null, phVal = null, oxyVal = null;

            if (data.temperature) {
                tempVal = parseFloat(data.temperature[0][1]).toFixed(1);
                gaugeTemp.refresh(tempVal);
                checkLimits("Temp", "Temp", tempVal, 20, 30, "°C");
            }
            if (data.ph) {
                phVal = parseFloat(data.ph[0][1]).toFixed(1);
                gaugePh.refresh(phVal);
                checkLimits("Ph", "pH", phVal, 6.5, 8.5, "");
            }
            if (data.oxygen) {
                oxyVal = parseFloat(data.oxygen[0][1]).toFixed(1);
                gaugeOxy.refresh(oxyVal);
                checkLimits("Oxy", "O2", oxyVal, 5.0, 15.0, "mg/L");
            }

            if (tempVal || phVal || oxyVal) {
                updateChart(timeStr, tempVal, phVal, oxyVal);
            }
        }

        function updateChart(time, temp, ph, oxy) {
            if (telemetryChart.data.labels.length >= maxChartPoints) {
                telemetryChart.data.labels.shift();
                telemetryChart.data.datasets.forEach(dataset => dataset.data.shift());
            }

            telemetryChart.data.labels.push(time);
            telemetryChart.data.datasets[0].data.push(temp);
            telemetryChart.data.datasets[1].data.push(ph);
            telemetryChart.data.datasets[2].data.push(oxy);
            telemetryChart.update();
        }

        function checkLimits(idSuffix, name, val, min, max, unit) {
            const badge = document.getElementById(`status${idSuffix}`);
            if (val >= min && val <= max) {
                badge.innerText = `OK (${val} ${unit})`;
                badge.className = "status-badge ok";
            } else {
                badge.innerText = `Alert (${val} ${unit})`;
                badge.className = "status-badge bad";
                pushAlert(`${name}: ${val} ${unit}`);
                playAlarmSound();
            }
        }

        function pushAlert(message) {
            const list = document.getElementById("alertsList");
            const count = document.getElementById("alertCount");

            if (alertCounter === 0) list.innerHTML = "";
            alertCounter++;
            count.innerText = Math.min(alertCounter, 10);

            const time = new Date().toLocaleTimeString();
            const item = document.createElement("div");
            item.className = "alert-item";
            item.innerHTML = `<div><strong>${message}</strong></div><div class="timestamp">${time}</div>`;

            list.prepend(item);

            const items = list.querySelectorAll(".alert-item");
            if (items.length > 10) {
                items[items.length - 1].remove();
            }
        }
    </script>
</body>
</html>
